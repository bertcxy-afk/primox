<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primo - Comida a Domicilio y Para Llevar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Stripe Dahlia SDK -->
    <script src="https://js.stripe.com/dahlia/stripe.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-20">
    <!-- Header -->
    <header class="bg-orange-500 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold">🍔 Primo</h1>
        <div class="flex gap-2">
            <button onclick="openCart()" class="bg-orange-600 px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1">
                🛒 Carrito (<span id="cart-count">0</span>)
            </button>
            <button onclick="openAdminLogin()" class="bg-gray-800 px-3 py-1.5 rounded-lg text-sm font-semibold">
                Admin
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4">
        <!-- Registro Cliente -->
        <section id="client-setup" class="bg-white p-4 rounded-xl shadow-sm mb-4">
            <h2 class="font-bold text-lg mb-2">Tus Datos</h2>
            <input type="text" id="client-name" placeholder="Tu Nombre *" class="w-full p-2 border rounded-lg mb-2 text-sm">
            <input type="text" id="client-bank" placeholder="Tu Cuenta Bancaria (Opcional para efectivo)" class="w-full p-2 border rounded-lg text-sm">
        </section>

        <!-- Menú de Comida -->
        <section>
            <h2 class="font-bold text-xl mb-3">Menú Disponible</h2>
            <div id="menu-container" class="space-y-4">
                <p class="text-gray-500 text-center py-4">Cargando menú...</p>
            </div>
        </section>
    </main>

    <!-- Modal Carrito / Checkout -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Tu Pedido</h3>
                <button onclick="closeCart()" class="text-gray-500 font-bold text-lg">✕</button>
            </div>
            <div id="cart-items" class="space-y-3 mb-4 divide-y"></div>
            <div class="border-t pt-3 font-bold text-lg flex justify-between mb-4">
                <span>Total:</span>
                <span id="cart-total">$0.00</span>
            </div>

            <!-- Método de Pago -->
            <div class="mb-4">
                <label class="block font-semibold text-sm mb-1">Método de Pago:</label>
                <select id="payment-method" onchange="togglePaymentFields()" class="w-full p-2 border rounded-lg text-sm mb-2">
                    <option value="efectivo">Efectivo</option>
                    <option value="tarjeta">Tarjeta (Formulario Seguro Stripe)</option>
                    <option value="transferencia">Transferencia (Cuenta de la Empresa)</option>
                </select>

                <!-- Si es efectivo -->
                <div id="cash-fields">
                    <label class="block text-xs text-gray-600 mb-1">¿Con cuánto vas a pagar? (Para calcular tu cambio):</label>
                    <input type="number" id="cash-amount" placeholder="Ej. 200" oninput="calculateChange()" class="w-full p-2 border rounded-lg text-sm">
                    <p id
